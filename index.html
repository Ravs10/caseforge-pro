<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaseForge PRO - All Tools Working</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{--bg:#08080a;--card:#121214;--card2:#1c1c21;--border:#2a2a32;--text:#e5e5e5;--accent:#a78bfa}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:var(--bg);color:var(--text)}
.header{padding:12px 15px;display:flex;justify-content:space-between;background:#08080a;border-bottom:1px solid var(--border);position:sticky;top:0}
.logo{font-weight:900;color:var(--accent)} .nav a{color:var(--accent);margin-left:12px;font-size:12px;font-weight:700;text-decoration:none}
.container{max-width:1250px;margin:0 auto;padding:12px;display:grid;grid-template-columns:1fr 380px;gap:14px}
@media(max-width:900px){.container{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.tab{padding:7px 12px;background:var(--card2);border:1px solid var(--border);border-radius:99px;font-size:11px;font-weight:700;cursor:pointer;display:inline-block;margin:3px}
.tab.active{background:var(--accent);color:#000}
textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:14px;min-height:130px;margin:6px 0}
.btn{padding:8px 11px;border-radius:9px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-weight:700;font-size:11px;cursor:pointer;margin:3px}
.btn.active{border-color:var(--accent);background:var(--accent);color:#000}
.small{font-size:11px;color:#9ca3af} .section{font-size:11px;font-weight:900;color:var(--accent);margin:14px 0 6px}
.drop{border:2px dashed var(--accent);border-radius:12px;padding:16px;text-align:center;background:var(--card2);cursor:pointer}
.tool-link{display:flex;align-items:center;gap:10px;padding:9px;border-radius:8px;background:rgba(255,255,255,.05);margin:6px 0;font-size:12px;text-decoration:none;color:var(--text)}
.tool-link img{width:18px;height:18px;background:#fff;border-radius:4px}
.fancy-item{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px;margin:8px 0}
.footer{text-align:center;padding:20px;font-size:12px;color:#9ca3af;border-top:1px solid var(--border);margin-top:20px}
.badge{font-size:9px;padding:3px 7px;border-radius:99px;background:var(--accent);color:#000;margin-left:auto;font-weight:800}
</style>
</head>
<body>
<div class="header"><div class="logo">CaseForge PRO ⚡</div><div class="nav"><a href="#useful">Tools</a><a href="#hire">Hire Me</a></div></div>
<div class="container">
<div>
<div class="card">
<h3>All-in-One Converter - FIXED</h3>
<p class="small">Vercel Static Version - Working</p>
<div class="drop" id="dropZone" onclick="document.getElementById('fileIn').click()">📁 Drag & Drop PDF/DOCX<input type="file" id="fileIn" hidden multiple accept=".txt,.pdf,.docx,.json,.csv" onchange="handleFiles(this.files)"></div>
